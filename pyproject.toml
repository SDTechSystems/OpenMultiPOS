[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "open_multi_pos"
authors = [{name = "OpenMultiPOS contributors"}]
description = "Extensión multi-marca para Frappe y demo POS local con impresión configurable"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "GPL-3.0-only"
dynamic = ["version"]
dependencies = ["qrcode==8.2"]

[project.optional-dependencies]
dev = ["ruff==0.14.1", "build==1.3.0", "pip-audit==2.9.0", "pypdf==6.15.0"]

[project.scripts]
openmultipos-demo = "open_multi_pos.demo.server:main"

[tool.bench.frappe-dependencies]
frappe = ">=16.50.0,<17.0.0"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
